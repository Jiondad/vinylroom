<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Vinyl Room · Tag Editor</title><link rel="stylesheet" href="tag-editor-ui.css?v=20261121-init-hotfix"><link rel="stylesheet" href="tag-editor-cover-draft.css?v=20261121-init-hotfix"></head>
<body class="locked"><div class="shell"><header class="editor-heading"><div><span class="eyebrow">VINYL ROOM / ADMIN</span><h1>Tag Editor</h1></div><div class="heading-actions"><span id="sourceBadge" class="badge">NAS 색인 · 읽기 전용</span><button disabled title="실제 태그·파일·Catalog 쓰기 비활성화">파일 저장 OFF</button></div></header>
<main class="workspace" id="editor"><aside class="browser"><div class="browser-heading"><h2>폴더 · 아티스트</h2><button id="browseToggle" aria-expanded="true" aria-controls="navigation">접기</button></div><div id="navigation"><form id="artistForm" class="search"><input id="artistSearch" type="search" placeholder="아티스트 검색" aria-label="아티스트 검색"><button aria-label="검색">검색</button></form><div id="searchResults"></div><nav id="artistList" aria-label="음악 폴더와 앨범"></nav></div></aside>
<section class="working"><section class="album-summary" id="albumHeader"><div class="cover-placeholder">◎</div><div><h2>앨범을 선택하세요</h2><p>왼쪽 폴더에서 앨범을 선택하면 태그를 표시합니다.</p></div></section>
<div id="loadStatus" role="status" aria-live="polite"></div>
<section class="bulk-toolbar" aria-label="일괄 초안 편집"><div class="toolbar-main"><label>범위<select id="bulkScope"><option value="selected">선택 트랙</option><option value="album">전체 앨범</option></select></label><label>작업<select id="bulkField"><option value="artist">ARTIST</option><option value="album_artist">ALBUMARTIST</option><option value="album">ALBUM</option><option value="date">DATE</option><option value="genre">GENRE</option><option value="featuring">FEATURING</option><option value="discnumber">DISCNUMBER</option><option value="title">TITLE · 선택 트랙만</option><option value="number">TRACKNUMBER · 자동 순번</option><option value="normalize">TRACKNUMBER · 두 자리</option><option value="from">파일명 → 태그</option><option value="to">태그 → 파일명</option></select></label><label class="bulk-value">값<input id="bulkValue" placeholder="변경할 값" aria-label="일괄 변경 값"></label><label>기존값<select id="bulkPolicy"><option value="empty">빈 필드만</option><option value="replace">명시적 덮어쓰기</option></select></label><button id="bulkApply" class="primary" disabled>초안 반영</button></div>
<div id="formatControls" hidden><label class="format-rule">형식<input id="format" value="%dummy%-%track% %title%" spellcheck="false"></label><select id="preset" aria-label="형식 프리셋"><option value="">프리셋</option><option value="%dummy%-%track% %title%">디스크 접두어 버리기</option><option value="%track% %title%">번호 + 제목</option><option value="%artist% - %track% - %title%">아티스트 - 번호 - 제목</option><option value="%dummy% - %dummy% - %track% - %title%">접두어 2개 버리기</option><option value="%discnumber%-%track% %title%">디스크-번호 제목</option></select><select id="variable" aria-label="변수 삽입"><option value="">변수 삽입</option></select></div><div class="toolbar-note"><span id="bulkStatus">변경사항은 브라우저 초안에만 반영됩니다.</span><button id="resetBtn" disabled>초안 초기화</button></div></section>
<section class="track-panel" aria-label="트랙 태그"><div class="table-heading"><span id="selectedCount">0곡 선택</span><div><label><input type="checkbox" id="missingOnly"> 누락·변경만</label><span id="trackCount">0곡</span></div></div><div class="table-scroll"><table><thead><tr><th><input id="selectAll" type="checkbox" aria-label="전체 트랙 선택"></th><th>파일명</th><th>트랙번호</th><th>TITLE</th><th>ARTIST</th><th>FEATURING</th><th>GENRE</th><th>상태</th></tr></thead><tbody id="tracks"><tr><td colspan="8" class="empty">선택한 앨범의 트랙이 여기에 표시됩니다.</td></tr></tbody></table></div></section>
<footer><span id="commonSummary"></span><span id="draftCount">변경 0곡</span></footer></section></main></div>
<dialog id="pathDialog"><div class="path-dialog"><h2>파일 경로</h2><p id="fullPath"></p><button id="closePath">닫기</button></div></dialog><div id="toast" role="status"></div><div id="accessLock">Tag Editor 화면 연결을 확인하는 중입니다. 화면이 계속 보이면 브라우저를 새로고침해 주세요.</div><script src="tag-editor-ui.js?v=20261121-init-hotfix" type="module"></script></body></html>
