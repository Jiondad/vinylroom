name: Tag Editor F5 restore scoped
on:
  push:
    branches: [fix/tag-editor-f5-restore-20261123]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: New code syntax and state restoration wiring
        run: |
          node --check frontend/dist/app-index.js
          node --check frontend/dist/admin-center.js
          node --check frontend/dist/tag-editor-ui.js
          node --check frontend/dist/tag-editor-host.js
          python3 - <<'PY'
          from pathlib import Path
          a=Path('frontend/dist/admin-center.js').read_text()
          p=Path('frontend/dist/app-index.js').read_text()
          t=Path('frontend/dist/tag-editor-ui.js').read_text()
          assert "tagEditorRefreshRequested()" in p
          assert "repo.admin&&isApprovedMember()" in p
          assert "sessionStorage.removeItem(ADMIN_VIEW_KEY)" in a
          assert "if(initialTagAlbum?.id||tagEditorRefreshRequested())tab('tag-editor')" in a
          assert "initialAlbum:initialTagAlbum||refreshAlbumSnapshot()" in a
          assert "sessionStorage.setItem(REFRESH_VIEW_KEY" in t
          assert "rememberEditorView()" in t
          assert "activateTool(toolGroups[refreshView?.tool]" in t
          assert "readRefreshView()" in t
          assert "confirm_write:true" not in t.split("function rememberEditorView(){")[1].split("function node(")[0]
          print('TAG_EDITOR_F5_RESTORE_SCOPED_PASS')
          PY
