name: Tag Editor viewport fill scoped test
on:
  push:
    branches: [fix/tag-editor-viewport-height-20261122]
jobs:
  viewport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test changed host viewport and layout only
        run: |
          node --check frontend/dist/tag-editor-host.js
          node --test frontend/tests/tag-editor-viewport-fill.test.mjs
      - name: Verify production bundle retains viewport sizing
        working-directory: frontend
        run: |
          node scripts/header-actions-release.mjs
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('out');html=(root/'index.html').read_text()
          release=re.search(r'releases/(header-actions-[0-9a-f]+)/entry.js',html).group(1)
          base=root/'releases'/release
          host=(base/'tag-editor-host.js').read_text()
          css=(base/'tag-editor-ui.css').read_text()
          page=(root/'tag-editor-ui.html').read_text()
          assert 'innerHeight-Math.max(0,r.top)-12' in host
          assert '.workspace .track-panel .table-scroll' in css
          assert '.workspace>.browser' in css
          assert '20261122-viewport-fill' in page
          print('VIEWPORT_FILL_SCOPED_PASS',release)
          PY
