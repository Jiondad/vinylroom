name: Tag Editor wide AlbumArtist layout scoped
on:
  push:
    branches: [fix/tag-editor-wide-table-albumartist-20261122]
jobs:
  scoped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check only changed Tag Editor JS and layout tests
        run: |
          node --check frontend/dist/tag-editor-ui.js
          node --check frontend/dist/tag-editor-host.js
          node --test frontend/tests/tag-editor-wide-albumartist-layout.test.mjs
      - name: Check production release includes new layout
        working-directory: frontend
        run: |
          node scripts/header-actions-release.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('out')
          html=(root/'index.html').read_text()
          m=re.search(r'releases/(header-actions-[0-9a-f]+)/entry.js',html)
          assert m
          release=root/'releases'/m.group(1)
          page=(root/'tag-editor-ui.html').read_text()
          ui=(release/'tag-editor-ui.js').read_text()
          style=(release/'tag-editor-ui.css').read_text()
          admin=(release/'admin-center.css').read_text()
          host=(release/'tag-editor-host.js').read_text()
          assert '<th>ALBUMARTIST</th>' in page
          assert "['tracknumber','title','artist','album_artist','featuring','genre']" in ui
          assert 'grid-template-columns:minmax(0,28.6%)' in style
          assert '.vinyl-admin-page.vr-tag-editor-active .vr-admin-inner' in admin
          assert 'tag-editor-ui.html?v=20261122-wide-albumartist' in host
          assert 'tag-editor-ui.js?v=20261122-wide-albumartist' in page
          print('TAG_EDITOR_WIDE_ALBUMARTIST_RELEASE_PASS',m.group(1))
          PY
