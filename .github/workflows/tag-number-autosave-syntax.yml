name: Tag number auto-save syntax check
on:
  push:
    branches: [fix/tag-number-autosave-ux-20261122]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax and requested UX changes
        run: |
          node --check frontend/dist/tag-editor-ui.js
          node --check frontend/dist/tag-editor-host.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('frontend/dist/tag-editor-ui.js').read_text()
          assert "function cell(e,f)" in s
          assert "del title=\"원본\"" not in s
          assert "await persistTagRows(intended,{automatic:true,onlyFields:['tracknumber','discnumber']})" in s
          assert "if(result.state!=='TAG_TRACK_WRITE_COMPLETED')" in s
          assert "const live=await api('/api/tracks?album='" in s
          print("SCOPED_NUMBER_AUTOSAVE_SYNTAX_PASS")
          PY
