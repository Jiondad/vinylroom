name: Tag Editor scoped full-save fixture
on:
  push:
    branches:
      - feature/tag-editor-complete-save-20261122
  workflow_dispatch:
jobs:
  isolated-full-tag-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated audio-tag dependencies
        run: python -m pip install mutagen==1.47.0 pillow imageio-ffmpeg
      - name: Check fixture encoder
        run: python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())'
      - name: Run only new save connection and path fixtures
        run: |
          export TAG_EDITOR_FIXTURE_FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          python -m unittest discover -s tests -p 'test_tag_save_wiring_20261122.py' -v
      - name: Check only new rename browser adapter
        run: node --test frontend/tests/tag-editor-rename-wiring-20261122.test.mjs
