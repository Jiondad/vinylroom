name: Tag Editor scoped full-save fixture
on:
  push:
    branches:
      - feature/tag-editor-complete-save-20261122
  workflow_dispatch:
jobs:
  isolated-full-tag-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated audio-tag dependencies
        run: python -m pip install mutagen==1.47.0 pillow
      - name: Check fixture encoder
        run: ffmpeg -version | head -n 1
      - name: Run only new full-tag writer fixtures
        run: python -m unittest discover -s tests -p 'test_tag_full_save_extension_20261122.py' -v
