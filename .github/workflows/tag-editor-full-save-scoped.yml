name: Tag Editor native adapter scoped checks
on:
  push:
    branches:
      - feature/tag-editor-complete-save-20261122
    paths:
      - 'nas/tag-editor-cover/*.py'
      - 'tests/test_tag_native_adapter_20261122.py'
      - 'tests/fixtures/native-fullsave/**'
      - '.github/workflows/tag-editor-full-save-scoped.yml'
  workflow_dispatch:
jobs:
  native-contract-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mutagen==1.47.0 pillow
      - name: Check only new native enqueue and deployment contracts
        run: python -m unittest discover -s tests -p 'test_tag_native_adapter_20261122.py' -v
