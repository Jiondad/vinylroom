name: Tag Editor admin HTTP dispatch scoped test
on:
  push:
    branches:
      - feature/tag-editor-complete-save-20261122
  workflow_dispatch:
jobs:
  isolated-admin-http-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only adapter import dependencies
        run: python -m pip install mutagen==1.47.0 pillow
      - name: Test only newly added HTTP dispatch boundary
        run: python -m unittest discover -s tests -p 'test_tag_admin_http_dispatch_20261122.py' -v
