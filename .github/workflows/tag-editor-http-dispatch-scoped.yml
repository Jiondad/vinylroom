name: Tag Editor full-save HTTP fixture scoped test
on:
  push:
    branches:
      - feature/tag-editor-complete-save-20261122
  workflow_dispatch:
jobs:
  isolated-admin-http-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only adapter import dependencies
        run: python -m pip install mutagen==1.47.0 pillow imageio-ffmpeg
      - name: Test only new handler to Writer fixture roundtrip
        run: python -m unittest discover -s tests -p 'test_tag_http_fullsave_fixture_20261122.py' -v
