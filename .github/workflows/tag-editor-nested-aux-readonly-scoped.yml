name: Tag Editor ancillary disc read-only scoped
on:
  push:
    branches: [fix/tag-editor-nested-aux-readonly-20261122]
jobs:
  ancillary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing adapter dependencies
        run: python -m pip install mutagen==1.47.0 pillow
      - name: Verify read-only ancillary folder exception and strict writer safeguards
        run: python -m unittest discover -s tests -p test_tag_nested_aux_readonly_20261122.py -v
