name: Tag Editor multi-field scoped
on:
  push:
    branches: [feature/tag-editor-mp3tag-multifield-20261123]
jobs:
  multi-field-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check only multi-field UI and save binding
        run: |
          node --check frontend/dist/tag-editor-ui.js
          node --check frontend/dist/tag-editor-host.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('frontend/dist/tag-editor-ui.js').read_text()
          html=Path('frontend/dist/tag-editor-ui.html').read_text()
          css=Path('frontend/dist/tag-editor-ui.css').read_text()
          fields=['title','artist','album','album_artist','date','tracknumber','discnumber','genre','featuring']
          assert all(f'data-multi-field="{field}"' in html for field in fields)
          assert '#multiTagSave' in js
          assert "if(!value)return null" in js
          assert "editedMulti.add(field)" in js
          assert "onlyFields:activeFields" in js
          assert "JSON.stringify(body.edits[f]||[])" in js
          assert "$('#multiTagPanel').hidden=tool!=='tags'" in js
          assert "tag-editor-ui.js?v=20261123-multifield-1" in html
          assert '.multi-tag-grid' in css
          print('TAG_EDITOR_MULTIFIELD_SCOPED_PASS')
          PY
