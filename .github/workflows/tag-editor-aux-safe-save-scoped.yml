name: Tag Editor nested auxiliary save scoped
on:
  push:
    branches: [feature/tag-editor-aux-safe-save-20261122]
jobs:
  save-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mutagen==1.47.0 pillow imageio-ffmpeg
      - name: Test only new nested ancillary album save plans and safety
        run: python -m unittest discover -s tests -p 'test_tag_aux_safe_save_20261122.py' -v
      - name: Syntax validate only changed NAS modules
        run: |
          python -m py_compile nas/tag-editor-cover/tag_phase2c.py nas/tag-editor-cover/tag_cover_http.py nas/tag-editor-cover/tag_cover_h.py nas/tag-editor-cover/tag_rename_writer.py
