name: Tag Editor full-save release candidate scoped build
on:
  push:
    branches: [release/tag-editor-full-save-ui-20261122]
jobs:
  candidate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check changed module JavaScript syntax
        run: |
          node --check frontend/dist/tag-editor-cover-draft.js
          node --check frontend/dist/tag-editor-host.js
          node --check frontend/dist/tag-editor-ui.js
      - name: Assemble the existing production frontend
        working-directory: frontend
        run: |
          node scripts/header-actions-release.mjs
          node scripts/copy-artist-profiles.mjs
      - name: Verify only Tag Editor full-save release bindings
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('out')
          html=(root/'index.html').read_text()
          m=re.search(r'releases/(header-actions-[0-9a-f]+)/entry.js',html)
          assert m,'production entry missing'
          base=root/'releases'/m.group(1)
          ui=(base/'tag-editor-ui.js').read_text()
          host=(base/'tag-editor-host.js').read_text()
          cover=(base/'tag-editor-cover-draft.js').read_text()
          panel=(root/'tag-editor-ui.html').read_text()
          album=(base/'app-index.js').read_text()
          top100=(base/'top100-ui.js').read_text()
          assert '/api/rename/plan' in host and '/api/rename/apply' in host
          assert 'NAS 파일명 저장 OFF' in host
          assert 'saveRenames()' in ui and 'RENAME_WRITE_COMPLETED' in ui
          assert 'READ_ONLY_TRACK_WRITE_PLAN' in ui and 'TAG_TRACK_WRITE_COMPLETED' in ui
          assert 'COVER_WRITE_COMPLETED' in cover and '/api/cover/apply' in cover
          assert 'tag-editor-ui.js?v=20261122-fullsave-release' in panel
          assert 'tag-editor-ui.html?v=20261122-fullsave-release' in host
          assert '태그 수정' in album and '정보 수정' in album
          assert 'showLyricDialog' in top100
          print('FULL_SAVE_RELEASE_BUNDLE_SCOPED_PASS',m.group(1))
          PY
